<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Garnavya — Code / Snap</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body>

<div class="stage">
  <div class="split-bg"></div>
  <div class="grain"></div>

  <div class="frame">
    <div class="side code" id="goCode">
      <span class="tag">01 — Build</span>
      <span class="word">code.</span>
      <span class="sub">The developer's terminal. Projects, stack, and how things get shipped.</span>
    </div>

    <div class="lever-housing" id="leverHousing" data-pos="mid">
      <div class="lever-plate" id="leverPlate" role="button" tabindex="0" aria-label="Toggle between Code and Snap">
        <div class="lever-track"></div>
        <div class="lever-knob" id="leverKnob"></div>
      </div>
    </div>

    <div class="side snap" id="goSnap">
      <span class="tag">02 — Frame</span>
      <span class="word">snap.</span>
      <span class="sub">The photographer's roll. Frames, gear, and the story behind each shot.</span>
    </div>
  </div>

  <footer>GARNAVYA RAWAL— TWO FACES, ONE SHUTTER</footer>
</div>

<div class="flash" id="flash"></div>

<script src="js/index.js" defer></script>

</body>
</html>
